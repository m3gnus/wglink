<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Waveguide Generator</title>
<style>
:root{--fg:#1f1f1f;--muted:#5c5c5c;--bg:#f7f7f7;--line:#d6d6d6;--accent:#2f7d32;--button:#ffffff}
@media (prefers-color-scheme: dark){:root{--fg:#e8e8e8;--muted:#a8a8a8;--bg:#2b2b2b;--line:#4a4a4a;--accent:#6fbf73;--button:#3a3a3a}}
body{font:14px system-ui,-apple-system,"Segoe UI",sans-serif;margin:14px 16px;color:var(--fg);background:var(--bg)}
button{font:inherit;padding:5px 12px;border:1px solid var(--line);border-radius:4px;background:var(--button);color:var(--fg);cursor:pointer}
section{border-bottom:1px solid var(--line);padding:8px 0 12px}nav{display:flex;gap:6px;flex-wrap:wrap}progress{display:block;margin:8px 0}
details{margin-top:18px;color:var(--muted)}
summary{cursor:pointer}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px}
[hidden]{display:none!important}
</style>
</head>
<body>
<nav id="filters"></nav>
<div id="history"></div>
<details><summary>Diagnostics</summary><pre id="diagnostics"></pre></details>
<script>
(function () {
  "use strict";
  function byId(id) { return document.getElementById(id); }
  function send(action, data) {
    try {
      if (window.adsk && typeof window.adsk.fusionSendData === "function") {
        return window.adsk.fusionSendData(action, data || "");
      }
    } catch (ignored) {}
    return null;
  }
  function render(view) {
    if (!view || typeof view !== "object") { return; }
    var active = document.activeElement;
    var focusAction = active && active.dataset ? active.dataset.action : null;
    var focusRequest = active && active.dataset ? active.dataset.requestId : null;
    var filters = byId("filters"), history = byId("history");
    filters.textContent = ""; history.textContent = "";
    ["thisDocument", "allDocuments", "clearFinished"].forEach(function (id) {
      var button = document.createElement("button");
      button.textContent = (view.labels || {})[id] || "";
      button.dataset.action = id;
      if (id !== "clearFinished") { button.setAttribute("aria-pressed", String((id === "allDocuments") === !!view.allDocuments)); }
      button.addEventListener("click", function () { send("action", JSON.stringify({id:id})); });
      filters.appendChild(button);
    });
    (view.entries || []).forEach(function (entry) {
      var row = document.createElement("section"), title = document.createElement("p");
      var fields = {document: entry.documentName || view.labels.unnamedDocument,
        kind: entry.kindLabel, time: new Date(entry.submittedAt * 1000).toLocaleString()};
      title.textContent = (view.labels || {}).rowTitle.replace(/\{(document|kind|time)\}/g,
        function (_, key) { return fields[key]; });
      row.appendChild(title);
      [entry.headline, entry.detail].concat(entry.options || [], entry.notes || []).forEach(function (text) {
        if (text) { var p = document.createElement("p"); p.textContent = text; row.appendChild(p); }
      });
      if (entry.busy || typeof entry.progress === "number") {
        var progress = document.createElement("progress"); progress.max = 1;
        if (typeof entry.progress === "number") { progress.value = entry.progress; }
        row.appendChild(progress);
      }
      (entry.actions || []).forEach(function (action) {
        var button = document.createElement("button"); button.textContent = action.label;
        button.dataset.action = action.id; button.dataset.requestId = entry.requestId;
        button.addEventListener("click", function () { send("action", JSON.stringify({id:action.id,requestId:entry.requestId})); });
        row.appendChild(button);
      });
      history.appendChild(row);
    });
    if (!(view.entries || []).length) { history.textContent = (view.labels || {}).empty || ""; }
    (view.historyNotes || []).forEach(function (note) { var p = document.createElement("p"); p.textContent = note; history.appendChild(p); });
    byId("diagnostics").textContent = JSON.stringify((view.entries || []).map(function (entry) { return entry.diagnostics; }), null, 2);
    if (focusAction) {
      Array.prototype.some.call(document.querySelectorAll("button"), function (button) {
        if (button.dataset.action === focusAction && (button.dataset.requestId || null) === (focusRequest || null)) {
          button.focus(); return true;
        }
        return false;
      });
    }
  }
  // True when the answer carried the state; an empty answer is asked again.
  function received(reply) {
    if (typeof reply === "string" && reply) {
      try { render(JSON.parse(reply)); return true; } catch (ignored) {}
    }
    return false;
  }
  // Python's updates; anything sent before "ready" below is lost by Fusion,
  // so the add-in answers "ready" with the whole state.
  window.fusionJavaScriptHandler = {
    handle: function (action, data) {
      try { if (action === "status") { render(JSON.parse(data)); } } catch (ignored) {}
      return "OK";
    }
  };
  try {
    if (location.hash.length > 1) { render(JSON.parse(decodeURIComponent(location.hash.slice(1)))); }
  } catch (ignored) {}
  function ready(attempt) {
    function again() {
      if (attempt < 50) { setTimeout(function () { ready(attempt + 1); }, 200); }
    }
    var reply = send("ready", "");
    if (reply === null) { again(); return; }
    if (reply && typeof reply.then === "function") {
      reply.then(function (value) { if (!received(value)) { again(); } }, again);
    } else if (!received(reply)) { again(); }
  }
  window.addEventListener("load", function () { ready(0); });
})();
</script>
</body>
</html>
